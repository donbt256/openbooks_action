name: OpenBooks (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openbooks-session
  cancel-in-progress: true

jobs:
  openbooks:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check required secrets
        env:
          TUNNELTO_TOKEN: ${{ secrets.TUNNELTO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TUNNELTO_TOKEN" || { echo "::error::Add TUNNELTO_TOKEN in repository Actions secrets."; exit 1; }

      - name: Generate random IRC username
        id: identity
        run: |
          set -euo pipefail
          IRC_NICK="openbooks-$(openssl rand -hex 4)"
          echo "irc_nick=$IRC_NICK" >> "$GITHUB_OUTPUT"
          echo "Generated IRC username: $IRC_NICK"

      - name: Start OpenBooks
        env:
          IRC_NICK: ${{ steps.identity.outputs.irc_nick }}
        run: |
          set -euo pipefail
          docker pull evanbuss/openbooks:latest
          docker run -d --rm \
            --name openbooks \
            -p 127.0.0.1:8080:80 \
            evanbuss/openbooks:latest \
            --name "$IRC_NICK"

      - name: Install and start tunnelto
        env:
          TUNNELTO_TOKEN: ${{ secrets.TUNNELTO_TOKEN }}
          IRC_NICK: ${{ steps.identity.outputs.irc_nick }}
        run: |
          set -euo pipefail
          echo "Installing tunnelto..."
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            https://app.tunnelto.me/install.sh | sh -s -- -t "$TUNNELTO_TOKEN"
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/usr/local/bin:$PATH"
          command -v tunnelto >/dev/null || { echo "::error::tunnelto installer completed but the CLI was not found on PATH."; exit 1; }

          echo "Starting tunnel for https://books.claired.net -> localhost:8080"
          echo "The tunnelto dashboard must have books.claired.net configured as a custom domain."
          nohup tunnelto add books.claired.net 8080 </dev/null >/tmp/tunnelto.log 2>&1 &
          echo $! > /tmp/tunnelto.pid

          for attempt in $(seq 1 60); do
            if curl --silent --show-error --connect-timeout 2 --max-time 4 \
              --output /dev/null https://books.claired.net/ 2>/dev/null; then
              {
                echo "## OpenBooks is running"
                echo
                echo "**URL:** https://books.claired.net"
                echo
                echo "**IRC username:** $IRC_NICK"
                echo
                echo "**No webpage password is configured. Anyone who knows this URL can access the temporary instance while this workflow runs.**"
                echo
                echo "Keep this workflow running while using OpenBooks. The free tunnel has a one-hour lifetime; the workflow will attempt to recreate it when the tunnel command exits."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "OpenBooks URL: https://books.claired.net"
              echo "IRC username: $IRC_NICK"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/tunnelto.pid)" 2>/dev/null; then
              echo "::error::tunnelto exited before books.claired.net became reachable."
              tail -n 100 /tmp/tunnelto.log || true
              exit 1
            fi

            if [ $((attempt % 10)) -eq 0 ]; then
              echo "Waiting for custom domain and HTTPS certificate (attempt $attempt/60)..."
              tail -n 10 /tmp/tunnelto.log || true
            fi
            sleep 2
          done

          echo "::error::books.claired.net did not become reachable within 120 seconds."
          echo "Check the custom-domain and DNS setup in the tunnelto dashboard."
          tail -n 100 /tmp/tunnelto.log || true
          exit 1

      - name: Diagnose IRC connectivity and stream logs
        run: |
          set +e
          echo "=== DNS lookup for IRC server ==="
          getent ahosts irc.irchighway.net || true

          echo
          echo "=== TCP/TLS connectivity test to irc.irchighway.net:6697 ==="
          timeout 15 openssl s_client -connect irc.irchighway.net:6697 -servername irc.irchighway.net -brief </dev/null 2>&1 || true

          echo
          echo "=== Initial OpenBooks container logs ==="
          docker logs --tail 100 openbooks 2>&1 || true

          echo
          echo "=== Streaming OpenBooks container logs ==="
          docker logs --follow --since=1m openbooks 2>&1 &
          LOG_PID=$!
          trap 'kill "$LOG_PID" 2>/dev/null || true' EXIT

          while true; do
            if ! docker inspect -f '{{.State.Running}}' openbooks 2>/dev/null | grep -q true; then
              echo "::error::OpenBooks container stopped unexpectedly."
              docker logs --tail 200 openbooks 2>&1 || true
              exit 1
            fi
            if ! kill -0 "$(cat /tmp/tunnelto.pid)" 2>/dev/null; then
              echo "tunnelto process exited; attempting to recreate the free one-hour tunnel."
              export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/usr/local/bin:$PATH"
              nohup tunnelto add books.claired.net 8080 </dev/null >>/tmp/tunnelto.log 2>&1 &
              echo $! > /tmp/tunnelto.pid
            fi
            sleep 30
          done

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs openbooks 2>/dev/null || true
          tail -n 100 /tmp/tunnelto.log 2>/dev/null || true

      - name: Stop OpenBooks
        if: always()
        run: docker stop openbooks 2>/dev/null || true
