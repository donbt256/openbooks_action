name: OpenBooks (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openbooks-session
  cancel-in-progress: true

jobs:
  openbooks:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check required secrets
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -euo pipefail
          test -n "$NGROK_AUTHTOKEN" || { echo "::error::Add NGROK_AUTHTOKEN in repository Actions secrets."; exit 1; }

      - name: Generate random IRC username
        id: identity
        run: |
          set -euo pipefail
          IRC_NICK="openbooks-$(openssl rand -hex 4)"
          echo "irc_nick=$IRC_NICK" >> "$GITHUB_OUTPUT"
          echo "Generated IRC username: $IRC_NICK"

      - name: Start OpenBooks
        env:
          IRC_NICK: ${{ steps.identity.outputs.irc_nick }}
        run: |
          set -euo pipefail
          docker pull evanbuss/openbooks:latest
          docker run -d --rm \
            --name openbooks \
            -p 127.0.0.1:8080:80 \
            evanbuss/openbooks:latest \
            --name "$IRC_NICK"

      - name: Install and start ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          IRC_NICK: ${{ steps.identity.outputs.irc_nick }}
        run: |
          set -euo pipefail
          echo "Downloading ngrok..."
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            --output /tmp/ngrok.tgz
          tar -xzf /tmp/ngrok.tgz -C /tmp

          echo "Configuring ngrok authentication..."
          /tmp/ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          echo "Starting ngrok tunnel without HTTP Basic Authentication..."
          nohup /tmp/ngrok http 8080 --log=stdout </dev/null >/tmp/ngrok.log 2>&1 &
          echo $! > /tmp/ngrok.pid

          for attempt in $(seq 1 30); do
            API_JSON="$(curl --fail --silent --connect-timeout 1 --max-time 2 \
              http://127.0.0.1:4040/api/tunnels 2>/dev/null || true)"
            URL="$(printf "%s" "$API_JSON" | jq -r '.tunnels[]? | select(.proto == "https") | .public_url' 2>/dev/null | head -n 1 || true)"

            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              {
                echo "## OpenBooks is running"
                echo
                echo "**URL:** $URL"
                echo
                echo "**IRC username:** $IRC_NICK"
                echo
                echo "**No webpage password is configured. Anyone who has this URL can access the temporary instance while this workflow runs.**"
                echo
                echo "Keep this workflow running while using OpenBooks. Downloaded files are sent to your browser; they are not retained by this workflow."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "OpenBooks URL: $URL"
              echo "IRC username: $IRC_NICK"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/ngrok.pid)" 2>/dev/null; then
              echo "::error::ngrok exited before creating an HTTPS tunnel."
              tail -n 80 /tmp/ngrok.log || true
              exit 1
            fi

            if [ $((attempt % 5)) -eq 0 ]; then
              echo "Still waiting for ngrok HTTPS URL (attempt $attempt/30)..."
              tail -n 10 /tmp/ngrok.log || true
            fi
            sleep 2
          done

          echo "::error::ngrok did not provide an HTTPS URL within the startup window. Recent ngrok log:"
          tail -n 80 /tmp/ngrok.log || true
          exit 1

      - name: Diagnose IRC connectivity and stream logs
        run: |
          set +e
          echo "=== DNS lookup for IRC server ==="
          getent ahosts irc.irchighway.net || true

          echo
          echo "=== TCP/TLS connectivity test to irc.irchighway.net:6697 ==="
          timeout 15 openssl s_client -connect irc.irchighway.net:6697 -servername irc.irchighway.net -brief </dev/null 2>&1 || true

          echo
          echo "=== Initial OpenBooks container logs ==="
          docker logs --tail 100 openbooks 2>&1 || true

          echo
          echo "=== Streaming OpenBooks container logs ==="
          echo "Reproduce the download failure in the iframe while this step is running."
          docker logs --follow --since=1m openbooks 2>&1 &
          LOG_PID=$!

          echo
          echo "=== Periodically checking recent ngrok request status codes ==="
          echo "Paths are shown without query strings; request headers and bodies are not logged."
          (
            while true; do
              REQUESTS="$(curl --fail --silent --connect-timeout 1 --max-time 3 http://127.0.0.1:4040/api/requests/http 2>/dev/null || true)"
              if [ -n "$REQUESTS" ]; then
                printf '%s' "$REQUESTS" | jq -r '.requests[-10:][]? | "NGROK_REQUEST method=\(.request.method) path=\(.request.uri | split("?")[0]) status=\(.response.status_code // "pending")"' 2>/dev/null || true
              else
                echo "ngrok request API not available yet"
              fi
              sleep 15
            done
          ) &
          REQUEST_LOG_PID=$!
          trap 'kill "$LOG_PID" "$REQUEST_LOG_PID" 2>/dev/null || true' EXIT

          while true; do
            if ! docker inspect -f '{{.State.Running}}' openbooks 2>/dev/null | grep -q true; then
              echo "::error::OpenBooks container stopped unexpectedly."
              docker logs --tail 200 openbooks 2>&1 || true
              exit 1
            fi
            sleep 30
          done

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs openbooks 2>/dev/null || true
          tail -n 100 /tmp/ngrok.log 2>/dev/null || true

      - name: Stop OpenBooks
        if: always()
        run: docker stop openbooks 2>/dev/null || true
